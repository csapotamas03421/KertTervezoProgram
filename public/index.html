<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Kerttervező</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

<div id="alap">

    <!-- ================= NÖVÉNY HOZZÁADÁS ================= -->
    <div id="novenyHozzaadas">
        <h3>Növény hozzáadása</h3>

        <form action="/add" method="POST">
            <input type="text" name="magyar" placeholder="Magyar név" required><br><br>
            <input type="text" name="latin" placeholder="Latin név" required><br><br>
            <input type="text" name="faj" placeholder="Faj" required><br><br>
            <input type="text" name="fajta" placeholder="Fajta" required><br><br>
            <input type="number" name="sortav" placeholder="Sortáv (cm)" required><br><br>
            <input type="number" name="totav" placeholder="Tőtáv (cm)" required><br><br>
            <input type="text" name="szereti" placeholder="Szereti (növény, ...)"><br><br>
            <input type="text" name="nem_szereti" placeholder="Nem szereti (növény, ...)"><br><br>

            <button type="submit">Hozzáadás</button>
        </form>
    </div>

    <hr>

    <!-- ================= KERT MÉRETEZÉS ================= -->
    <div id="kertmeretMegadasa">
        <h3>Kert méreteinek megadása</h3>

        <!-- FONTOS: nem submitol -->
        <form onsubmit="return false;">
            <input type="number" name="kert_szelessege" placeholder="Kert szélessége (m)"><br><br>
            <input type="number" name="kert_magassaga" placeholder="Kert magassága (m)"><br><br>

            <button type="button" id="kertSzamitas">Kert terület számítása</button>

            <br><br>

            <input type="number" name="agyasok_szelessege" placeholder="Ágyások szélessége (m)"><br><br>
            <input type="number" name="agyasok_magassaga" placeholder="Ágyások magassága (m)"><br><br>
            <input type="number" name="agyasok_darabszama" placeholder="Ágyások darabszáma"><br><br>

            <button type="button" id="agyasSzamitas">Ágyások összterülete</button>
            <button type="button" id="agyasReset">Ágyások törlése</button>

            <br>
            <button type="button" id="ellenorzes">Tervezés (elfér-e)</button>
            <br>

            <!-- ===== NÖVÉNYEK LEGDÖRÜLŐ LISTA ===== -->
            <select id="novenyekLista">
                <option value="" disabled selected>Válassz növényt</option>
            </select>
            <input type="number" name="noveny_darabszama" placeholder="Növény darabszáma"><br><br>
            <button type="button" id="noveny_elhelyezes">Növény elhelyezése</button><br><br>

            <br><br>

            <button type="button" id="megjelenites">Megjelenítés</button>
        </form>
    </div>

</div>

<script>
let jo_kert = false;

/* ===== KERT TERÜLET ===== */
document.getElementById("kertSzamitas").onclick = () => {
    const sz = Number(document.querySelector('[name="kert_szelessege"]').value);
    const m = Number(document.querySelector('[name="kert_magassaga"]').value);
    if (sz && m) {
        alert(`A kert területe: ${sz * m} m²`);
    }
};

/* ===== ÁGYÁS TERÜLET ===== */
document.getElementById("agyasSzamitas").onclick = () => {
    const sz = Number(document.querySelector('[name="agyasok_szelessege"]').value);
    const m = Number(document.querySelector('[name="agyasok_magassaga"]').value);
    const db = Number(document.querySelector('[name="agyasok_darabszama"]').value);
    if (sz && m && db) {
        alert(`Ágyások összterülete: ${sz * m * db} m²`);
    }
};

/* ===== RESET ===== */
document.getElementById("agyasReset").onclick = () => {
    document.querySelector('[name="agyasok_szelessege"]').value = "";
    document.querySelector('[name="agyasok_magassaga"]').value = "";
    document.querySelector('[name="agyasok_darabszama"]').value = "";
};

/* ===== ELFER-E ===== */
document.getElementById("ellenorzes").onclick = () => {
    const kertT =
        Number(document.querySelector('[name="kert_szelessege"]').value) *
        Number(document.querySelector('[name="kert_magassaga"]').value);

    const agyasT =
        Number(document.querySelector('[name="agyasok_szelessege"]').value) *
        Number(document.querySelector('[name="agyasok_magassaga"]').value) *
        Number(document.querySelector('[name="agyasok_darabszama"]').value);

    jo_kert = agyasT <= kertT;
    alert(jo_kert ? "Az ágyások elférnek." : "Az ágyások nem férnek el.");
};

/* ===== KERT MENTÉS ===== */
document.getElementById("megjelenites").onclick = () => {
    if (!jo_kert) {
        alert("Előbb ellenőrizd, hogy elférnek-e!");
        return;
    }

    fetch("/saveGarden", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            kert_szelessege: document.querySelector('[name="kert_szelessege"]').value,
            kert_magassaga: document.querySelector('[name="kert_magassaga"]').value,
            agyasok_szelessege: document.querySelector('[name="agyasok_szelessege"]').value,
            agyasok_magassaga: document.querySelector('[name="agyasok_magassaga"]').value,
            agyasok_darabszama: document.querySelector('[name="agyasok_darabszama"]').value
        })
    }).then(() => {
        window.location.href = "kert_megjelenites.html";
    });
};

/* ===== 🌱 NÖVÉNYEK BETÖLTÉSE JSON-BŐL ===== */
fetch('/data/novenyAdatok.json')
    .then(r => {
        if (!r.ok) throw new Error("JSON nem érhető el");
        return r.json();
    })
    .then(data => {
        const select = document.getElementById("novenyekLista");
        data.forEach(noveny => {
            const option = document.createElement("option");
            option.value = noveny.id;
            option.textContent = noveny.magyar;
            select.appendChild(option);
        });
    })
    .catch(err => console.error("Betöltési hiba:", err));

/* ===== 🌱 NÖVÉNY ELHELYEZÉS ===== */
document.getElementById("noveny_elhelyezes").onclick = () => {
    const select = document.getElementById("novenyekLista");
    const darab = Number(document.querySelector('[name="noveny_darabszama"]').value);

    if (!select.value) {
        alert("Nem választottál növényt!");
        return;
    }

    if (!darab || darab <= 0) {
        alert("Adj meg egy érvényes darabszámot!");
        return;
    }

    const novenyNev = select.options[select.selectedIndex].text;

    // 🔥 IGAZI MENTÉS
    fetch("/savePlant", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            noveny_id: select.value,
            noveny_nev: novenyNev,
            darabszam: darab
        })
    })
    .then(r => r.text())
    .then(msg => alert(msg));

    alert(`Elhelyezve: ${darab} db ${novenyNev}`);
};

</script>

</body>
</html>
